name: 核验数据并发布 GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
      - run: npm run lint
      - run: npm test
      - name: 生成静态网站
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
      - run: npm run test:pages
      - name: 保存可信的自动核验变化
        run: |
          if git diff --quiet -- data/sync-status.json data/auto-sync.json; then
            exit 0
          fi
          git config user.name "digital-tools-guide-sync"
          git config user.email "digital-tools-guide-sync@users.noreply.github.com"
          git add data/sync-status.json data/auto-sync.json
          git commit -m "chore: 更新公开核验数据"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布公开网站
        id: deployment
        uses: actions/deploy-pages@v4
